<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
</head>
<body class="hold-transition skin-blue-light sidebar-mini fixed">
  <div class="wrapper">
    <div class="content-wrapper" id="page-wrapper">
      <div class="" th:fragment="section">
          <div class="margin-homepage">    
            <div class="container">
              <div style="text-align:center;">                
                <h3 >Modify Slot/Delete - Registered Course(s)</h3>
            </div>
            <br/>
			
            <div align="center" style="color: Red; font-weight: bold;" th:if="${ModifyCourse.size()==0}" th:text="${'No Records Found'}"></div>
            
            <script th:inline="javascript">
			/*<![CDATA[*/			
				var info = [[${info}]];
				var infoMessage = [[${infoMessage}]];
													
				if ((info != null) && (info != ""))
				{					
					swal({
				    	title: info,
				    	type : 'success',
				    	confirmButtonColor: '#3085d6'
					},
					
					function(button) 
					{			
					    if (button == true) 
					    {
					    	window.setTimeout(function ()
					    	{
					    		
					    	}, 0);		    			    	
					    }
					});
				}
				
				if ((infoMessage != null) && (infoMessage != ""))
				{
					swal({
				    	title: infoMessage,
				    	type : 'info',
				    	confirmButtonColor: '#3085d6'
					},
					
					function(button) 
					{			
					    if (button == true) 
					    {
					    	window.setTimeout(function ()
					    	{
					    		
					    	}, 0);		    			    	
					    }
					});
				}
									
				/*]]>*/
				</script>
				
           <div class="table-responsive" style="margin-bottom: 30px;">
            
			<table class="w3-table-all w3-card-4 w3-hoverable" style="background-color: #e0f8f8;" th:if="${not #lists.isEmpty(ModifyCourse)}">
              <thead>
                <tr class="w3-blue">
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 15%;">Course Details</th>
                  <!--<th style="border:1px solid #3c8dbc; text-align: center; width: 4%;">L T P J</th>-->
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 2%;">Credit</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 10%;">Course Category</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 5%;">Course Option</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 15%;">Class Detail</th>
                 <th style="border:1px solid #3c8dbc; text-align: center; width: 10%;">Slot</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 10%;">Faculty</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 8%;">Status</th>
                  <th style="border:1px solid #3c8dbc; text-align: center; width: 5%;">Modify</th>   
                   <th style="border:1px solid #3c8dbc; text-align: center; width: 5%;">Delete</th>                
                </tr>
              </thead>
              
              <tr th:each="RegisteredList : ${ModifyCourse}">
                  
                  <td style="border:1px solid #3c8dbc; text-align: center;" 
                  		th:text="${RegisteredList[1]+ ' -' +RegisteredList[2]+ ' - ' +RegisteredList[5]}"></td>                  

                  <td style="border:1px solid #3c8dbc; text-align: center;">
                  		<span th:text="${RegisteredList[10]}"></span></td>
                  
                  <td style="border: 1px solid #3c8dbc; text-align: center;">


						<span th:if="${curriculumMapList.isEmpty()}" th:text="${'-'}"></span>
										
						<th:block th:if="${(!curriculumMapList.isEmpty() and RegisteredList[3]!='Minor' 
						and RegisteredList[3] != 'Honours') 
									and (curriculumMapList.containsKey(RegisteredList[1]))}" 
								  th:each="e2 :${curriculumMapList.get(RegisteredList[1])}">
							<div th:if="${e2[9] == null}">
							<span th:if="${(e2[2] == 'CC') or (e2[2] == 'ME')}" th:text="${e2[1]}"></span>
							<span th:if="${e2[2] == 'BC' and e2[1] != 'Concentration'}" th:text="${e2[1] +' ('+ e2[7] +' Basket)'}"></span>
							<span th:if="${e2[1] == 'Concentration'}" th:text="${e2[1] +' ('+ e2[8] +' Basket)'}"></span>
							</div>
							<span th:if="${e2[9] != null}" th:text="${e2[10] +' Basket'}"></span>
						</th:block>
						
						<th:block th:if="${RegisteredList[3] == 'Minor' or RegisteredList[3] == 'Honours'}" >
							<span th:text="${RegisteredList[3]}"></span>
						</th:block>


						<span th:if="${(!curriculumMapList.isEmpty() and RegisteredList[3]!='Minor' 
						and RegisteredList[3] != 'Honours') 
								and (!curriculumMapList.containsKey(RegisteredList[1]))}"
							  th:text="${session.StudySystem[0] == 'ACE' ? 'Open Elective' : 'University Elective'}"></span>


				  </td>
								
                  <td style="border:1px solid #3c8dbc; text-align: center;" 
                  		th:text="${RegisteredList[3]}"></td>
                  		
                  <td style="border:1px solid #3c8dbc; text-align: center;" >
                  		<span th:text="${RegisteredList[12]+' - '}"></span>
                  		<span th:if="${(RegisteredList[4] != 'EPJ') and (RegisteredList[4] != 'PJT')}"
												th:text="${RegisteredList[15]+ ' - '}"></span>
						<span th:if="${(RegisteredList[4] == 'EPJ') or (RegisteredList[4] == 'PJT')}" 
												th:text="${'NIL'+ ' - '}"></span>
					    <span th:text="${RegisteredList[14]}"></span>
				  </td>
                  <td style="border:1px solid #3c8dbc; text-align: center;" 
                  		th:text="${RegisteredList[13]}"></td>
                  		 <td style="border:1px solid #3c8dbc; text-align: center;" 
                  		th:text="${RegisteredList[16] +' - '+ RegisteredList[15]}"></td>
                <td align="center" th:style="${'color:'+statusMap.get(RegisteredList[18]+'').get(1) + ';border:1px solid #3c8dbc;text-align: center;'}"
										th:text="${statusMap.get(RegisteredList[18]+'').get(0)}"></td>
									
				
				  <td style="border:1px solid #3c8dbc; text-align: center;" 
				  		th:if="${(RegisteredList[4] != 'EPJ') and 
							(#lists.contains(blockedCourse, RegisteredList[0]) == false)}">
				        <!-- chennai code disable modify option etp etlp 
                  			                  		th:if="${(#lists.contains(session.compulsoryCourseList, RegisteredList[1])== false and RegisteredList[25]!='ETL' and RegisteredList[25]!='ETLP')
                  			-->          			
                  	<button class="btn-success w3-btn w3-btn-red w3-round-large" type="button"  
                  		style="border:1px solid #3c8dbc;"                   		
                  		th:data-parameter1="${RegisteredList[12] +'/'+ RegisteredList[0] +'/'+ RegisteredList[4]}"
                  		th:data-csrfname="${_csrf?.parameterName}" 
						th:data-csrfvalue="${_csrf?.token}"  				  		  
                  		th:onclick="javascript: editRegisteredSlots(this.getAttribute('data-parameter1'), 
                  			this)"
                  			
                  		th:if="${(#lists.contains(session.compulsoryCourseList, RegisteredList[1])== false)
                  		or (#lists.contains(session.compulsoryCourseList, RegisteredList[1]))}">Modify</button>
                  </td>               			
                  <td style="border:1px solid #3c8dbc; text-align: center; font-weight: bold;" 
                  		th:if="${(RegisteredList[4] == 'EPJ') or 
							(#lists.contains(blockedCourse, RegisteredList[0]) == true)}" 
						th:text="${'Blocked'}"></td>
						
						<td style="border:1px solid #3c8dbc; text-align: center;"
										th:if="${#lists.contains(blockedCourse, RegisteredList[0]) == false}">
										
									<button class="btn-warning w3-btn w3-btn-red w3-round-large" type="button"
										th:if="${#lists.contains(blockedCourse, RegisteredList[0]) == false and
										(#lists.contains(session.compulsoryCourseList, RegisteredList[1]) == false 
										or (#lists.contains(session.compulsoryCourseList, RegisteredList[1]) and RegisteredList[24]!=null and RegisteredList[24]!='') )}"  
										th:data-parameter1="${RegisteredList[0]}" 
										th:data-csrfname="${_csrf?.parameterName}" 
										th:data-csrfvalue="${_csrf?.token}" 
  				 						th:onclick="javascript:processDeleteCourseRegistration(
  				 							this.getAttribute('data-parameter1'), this)">Delete</button>
  				 							
  				 							<span th:if="${#lists.contains(blockedCourse, RegisteredList[0]) or
										(#lists.contains(session.compulsoryCourseList, RegisteredList[1])
										and (RegisteredList[24]==null or RegisteredList[24]==''))}" >-NA-</span>
								</td>
				                
                </tr>
                
            </table>
            </div><br/>
			
			<th:block th:include="mainpages/ViewRegistered::creditInfo"></th:block>
			<br />
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
