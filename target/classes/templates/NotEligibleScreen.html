<!DOCTYPE html>
<!--
  Author: Sivaraman C & Kishore B
-->
<html xmlns:th="http://www.thymeleaf.org">
<head th:include="layouts/Header :: style_sheets">
<base th:href="@{${session.baseURL}}" />
<link href="assets/img/favicon1.png" rel="icon" type="image/x-icon" />
<meta http-equiv="cache-control" content="max-age=0" />
<meta http-equiv="cache-control" content="no-cache" />
<meta http-equiv="expires" content="0" />

<style>
#customers {
	font-family: Arial, Helvetica, sans-serif;
	border-collapse: collapse;
	width: 100%;
}

#customers td, #customers th {
	border: 1px solid #ddd;
	padding: 8px;
}

#customers tr:nth-child(even) {
	background-color: #f2f2f2;
}

#customers tr:hover {
	background-color: #ddd;
}

#customers th {
	padding-top: 12px;
	padding-bottom: 12px;
	text-align: left;
	background-color: #04AA6D;
	color: white;
}
</style>
</head>

<body style="padding: 0px; margin: 0px; background-color: #ECF0F5">

	<div class="container">

		<form th:action="@{/logout}" method="post">
			<input type="hidden" th:name="${_csrf?.parameterName}"
				th:value="${_csrf?.token}" />

			<div align="center"
				style="margin: auto; background-color: white; padding-top: 50px;">
				<h2 style="color: red;">Your session not started / You are NOT eligible for the current
					registration !!!!</h2>

				<div align="center">

					<table class="w3-table-all w3-card-4 w3-hoverable"
						style="width:60%;margin-top: 40px;">
						<tr><td colspan="2" align="center" style="text-align: center;
						font-weight: bold;font-size: 18px;">CHECKLIST INFO</td></tr>
						<th:block th:each="progressVal, idx : ${eligibilityResult}">
							<tr>
								<td
									style="text-align: left; border: 1px solid #3c8dbc; font-weight: bold; width:40%;">
									<span th:text="${progressVal.key}"></span>
								</td>
								<td style="text-align: center; border: 1px solid #3c8dbc;" >
								
								<span  th:text="${progressVal.value}" style="color: red;" th:if="${#lists.contains(ineligibleKeys, progressVal.key)}" ></span>
								<span  th:text="${progressVal.value}" th:if="${!#lists.contains(ineligibleKeys,progressVal.key )}" ></span>

								</td>
							</tr>
						</th:block>

					</table>

				</div>

				<div align="center">
					<input type="submit" class="buttonClass"
						style="padding: 10px 20px 10px 20px; font-weight :bold; margin: 10px; background-color: #04AA6D; color: white"
						value="Proceed to Login" />
				</div>


			</div>
		</form>
	</div>
</body>
</html>
