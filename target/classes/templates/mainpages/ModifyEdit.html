<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<base th:href="@{${session.baseURL}}" />
</head>
<body class="hold-transition skin-blue-light sidebar-mini fixed">
	<div class="wrapper">
		<!-- Content Wrapper. Contains page content -->
		<div class="content-wrapper" id="page-wrapper">
			<div class="" th:fragment="section">
				<div class="margin-homepage">
					<div class="container">
						<h3>Modify Slot - Registered Course(s)</h3>

						<div style="color: red; font-size: 20px;">
							<script th:inline="javascript">
							/*<![CDATA[*/
									
									var info = [[${info}]];
									var showFlag = [[${showFlag}]];
							
									if (info!=null)
									{
										swal({

									var info = [[${info}]];
									var infoMessage = [[${infoMessage}]];

									{
										swal({
									    	title: info,
									    	type : 'success',
									    	confirmButtonColor: '#3085d6'
										},
										
										function(button) 
										{			
										    if (button == true) 
										    {
										    	window.setTimeout(function ()
										    	{
										    		
										    	}, 0);		    			    	
										    }

									}
									
									if (infoMessage!=null)
									{
										swal({

										{

										    }
										});
									}
							/*]]>*/
							</script>
						</div>

						<div class="table-responsive">

							<table class="w3-table-all w3-card-4 w3-hoverable"
								style="background-color: #e0f8f8;">
								<thead>
									<tr class="w3-blue">
										<th style="border: 1px solid #3c8dbc; text-align: center;">Course
											Code</th>
										<th style="border: 1px solid #3c8dbc; text-align: center;">Course
											Title</th>
										<th style="border: 1px solid #3c8dbc; text-align: center;">Course
											Type</th>
									</tr>
								</thead>
								<tr>
									<td style="border: 1px solid #3c8dbc; text-align: center;"
										th:text="${courseCatalogModel.getCode()}"></td>
									<td style="border: 1px solid #3c8dbc; text-align: center;"
										th:text="${courseCatalogModel.getTitle()}"></td>
									<td style="border: 1px solid #3c8dbc; text-align: center;"
										th:text="${courseCatalogModel.getGenericCourseType()}"></td>
								</tr>
							</table>
						</div>
						<br />

						<form role="form" name="ModifySlot" id="ModifySlot" method="post"
							autocomplete="off">

							<input type="hidden" th:name="${_csrf?.parameterName}"
								th:value="${_csrf?.token}" />
								<input type="hidden" name="gCourseype"  th:value="${courseCatalogModel.getGenericCourseType()}"/>

							<div class="table-responsive">

								<table class="w3-table-all w3-card-4 w3-hoverable"
									style="background: #000428; /* fallback for old browsers */ background: -webkit-linear-gradient(to right, #004e92, #000428); /* Chrome 10-25, Safari 5.1-6 */ background: linear-gradient(to right, #004e92, #000428);">

									<thead>
										<tr class="w3-blue">
											<th
												style="border: 1px solid #ddd; text-align: center; vertical-align: middle;"
												rowspan="2">Slot</th>
											<th
												style="border: 1px solid #ddd; text-align: center; vertical-align: middle;"
												rowspan="2">Venue</th>
											<th
												style="border: 1px solid #ddd; text-align: center; vertical-align: middle;"
												rowspan="2">Faculty</th>
												<th style="border: 1px solid #ddd; text-align: center; 
													vertical-align: middle;">General</th>
										</tr>
										<tr class="w3-blue">
											<th style="text-align: center;">Available</th>
										</tr>
									</thead>

									<tr th:each="RegisteredList:${courseAllocationList}" 
										th:if="${(RegisteredList.getCourseTypeComponentModel().getCourseType() != 'PJT')
										and #lists.isEmpty(cam) and #lists.isEmpty(cam2) }">

										<td style="border: 1px solid #3c8dbc; text-align: center;"
											th:text="${RegisteredList.getTimeTableModel().getSlotName()}"></td>
										<td style="border: 1px solid #3c8dbc; text-align: center;"
											th:text="${RegisteredList.getRoomMasterRoomNumber()}"></td>
										<td style="border: 1px solid #3c8dbc;"
											th:text="${RegisteredList.getEmployeeProfile().getFirstName()}"></td>

										<td style="border: 1px solid #3c8dbc; text-align: center;">
											<input type="radio" name="courseOption" id="courseOption"
											th:if="${RegisteredList.getAvailableSeats()  &gt; 0}"
											th:checked="${oldClassId == RegisteredList.getClassId()}"
											th:value="${RegisteredList.getClassId() 
													+','+  RegisteredList.getCourseId() 
													+','+ RegisteredList.getCourseType() 
													+','+ RegisteredList.getTimeTableModel().getClashSlot()}" />
											<span th:text="${RegisteredList.getAvailableSeats()}"></span>
										</td>

									</tr>

									<th:block th:if="${not #lists.isEmpty(cam)} ">
										<tr th:each="courseAllocationModells : ${cam}"
											th:if="${(courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'ETH') 
										 	or (courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'TH') 
										 	or (courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'SS')
										 	or ((crCourseStatus != 1) and (courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'LO')) 
										 	or (courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'OC')}">

											<td style="text-align: center; border: 1px solid #095988;"
												th:text="${courseAllocationModells.getTimeTableModel().getSlotName()}"></td>
											<td style="text-align: center; border: 1px solid #095988;"
												th:text="${courseAllocationModells.getRoomMasterRoomNumber()}"></td>
											<td style="text-align: left; border: 1px solid #095988;"
												th:text="${courseAllocationModells.getEmployeeProfile().getFirstName()}"></td>



											<th:block>
												<input type="hidden" name="clashSlots1" id="clashSlots1"
													th:value="${courseAllocationModells.getTimeTableModel().getClashSlot()}" />
											</th:block>

											<th:block
												th:if="${(courseCatalogModel.getGenericCourseType() == 'ETL') or (courseCatalogModel.getGenericCourseType() == 'ETLP') 
													or ((crCourseStatus == 1) and (courseCatalogModel.getGenericCourseType() == 'TH'))}">
												<td style="text-align: center; border: 1px solid #095988;">
													<input type="radio" name="courseOption" id="courseOption"
													th:value="${courseAllocationModells.getClassId() 
													+','+  courseAllocationModells.getCourseId() 
													+','+ courseAllocationModells.getCourseType() 
													+','+ courseAllocationModells.getTimeTableModel().getClashSlot()}"
													th:checked="${courseAllocationModells.getClassId() == tlClassId}"
													th:data-parameter1="${courseAllocationModells.getCourseCatalogModel().getCourseId()}"
													th:data-parameter2="${courseAllocationModells.getErpId()}"
													th:data-parameter3="${courseAllocationModells.getCourseCatalogModel().getGenericCourseType()}"
													th:data-parameter4="${courseAllocationModells.getClassId()}"
													th:data-csrfname="${_csrf?.parameterName}"
													th:data-csrfvalue="${_csrf?.token}"
													th:onclick="javascript: getCorrespondingCourse(this.getAttribute('data-parameter1'), 
											  		this.getAttribute('data-parameter2'), this.getAttribute('data-parameter3'), 
											  		this.getAttribute('data-parameter4'), this)"
													th:if="${courseAllocationModells.getAvailableSeats() &gt;0}" />
													<span
													th:text="${courseAllocationModells.getAvailableSeats() &gt;0}?${courseAllocationModells.getAvailableSeats()}:'Full'"></span>
												</td>


											</th:block>
								

										<th:block
											th:if="${(courseCatalogModel.getGenericCourseType() != 'ETL') and (courseCatalogModel.getGenericCourseType() != 'ETLP') 
														and (crCourseStatus != 1)}">
											<td style="text-align: center; border: 1px solid #095988;">
												<input type="radio" name="courseOption1" id="courseOption1"
												th:value="${courseAllocationModells.getClassId() 
													+','+  courseAllocationModells.getCourseId() 
													+','+ courseAllocationModells.getCourseType() 
													+','+ courseAllocationModells.getTimeTableModel().getClashSlot()}"
												th:checked="${courseAllocationModells.getClassId() == tlClassId}"
												th:if="${courseAllocationModells.getAvailableSeats() &gt;0}" />
												<span
												th:text="${courseAllocationModells.getAvailableSeats() &gt;0}?${courseAllocationModells.getAvailableSeats()}:'Full'"></span>
											</td>

										</th:block>

										</tr>

									</th:block>

									<th:block th:if="${not #lists.isEmpty(cam2)}">
									
											<tr
											style="background: #000e36; /* fallback for old browsers */ background: -webkit-linear-gradient(to right, #000e36, #004e92, #004e92, #000e36); /* Chrome 10-25, Safari 5.1-6 */ background: linear-gradient(to right, #000e36, #004e92, #004e92, #000e36); /* W3C, IE 10+/ Edge, Firefox 16+, Chrome 26+, Opera 12+, Safari 7+ */ color: #fff; border: 1px solid #095988; color: #fff;"
											th:if="${cam2!=null}">
											<td colspan="6">
												<div
													style="font-weight: bold; text-align: center; color: navajowhite;">Lab
													Slots</div>
											</td>
										</tr>
									
									
										<tr th:each="courseAllocationModells : ${cam2}"
											th:if="${(courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'ELA') 
											or ((crCourseStatus == 1) and (courseAllocationModells.getCourseTypeComponentModel().getCourseType() == 'LO'))}">

											<td style="text-align: center; border: 1px solid #095988;"
												th:text="${courseAllocationModells.getTimeTableModel().getSlotName()}"></td>
											<td style="text-align: center; border: 1px solid #095988;"
												th:text="${courseAllocationModells.getRoomMasterRoomNumber()}"></td>
											<td style="border: 1px solid #095988;"
												th:text="${courseAllocationModells.getEmployeeProfile().getFirstName()}"></td>



											<td style="text-align: center; border: 1px solid #095988;">
												<input type="radio" name="courseOption3" id="courseOption3"
												th:checked="${courseAllocationModells.getClassId() == llClassId}"
												th:value="${courseAllocationModells.getClassId() 
													+','+  courseAllocationModells.getCourseId() 
													+','+ courseAllocationModells.getCourseType() 
													+','+ courseAllocationModells.getTimeTableModel().getClashSlot()}"
												th:if="${(courseAllocationModells.getTotalSeats() - courseAllocationModells.getRegisteredSeats()) &gt; 0}" />
												<span
												th:text="${(courseAllocationModells.getTotalSeats() - courseAllocationModells.getRegisteredSeats()) &gt; 0 and (courseAllocationModells.getAvailableSeats() != 0)}?${courseAllocationModells.getAvailableSeats()}:'Full'"></span>
											</td>

											<th:block>
												<input type="hidden" name="clashSlots2" id="clashSlots2"
													th:value="${courseAllocationModells.getTimeTableModel().getClashSlot()}" />
											</th:block>

										</tr>
									</th:block>
									
									<th:block><input type="hidden" th:value="${cam2!=null ? 1 : 0}" name="labSlotVal"
									id="labSlotVal" /></th:block>

									<tr th:if="${otpAllowStatus == 1}"
										style="background-color: rgb(181, 209, 232); color: #360D20; text-shadow: aqua;">
										<td colspan="1" valign="middle"
											style="width: 30%; vertical-align: middle; text-indent: 100px; font-weight: bold; font-size: 18px; border: 1px solid #095988;"><b>E-Mail
												OTP</b></td>
										<td style="font-weight: bold;text-align: right; vertical-align: middle; "><span th:text="${session.prefixOTP}+' - '"></span></td>
										<td colspan="3"
											style="border: 1px solid #095988; font-weight: bolder;">
											<div class="col-md-6 form-group">
											<input
													type="text" class="form-control" name="mailOTP"
													id="mailOTP" maxlength="5"/>
											</div>
										</td>
									</tr>

									<tr th:if="${otpAllowStatus == 2}"
										style="background-color: rgb(181, 209, 232); color: #360D20; text-shadow: aqua;">
										<td colspan="5"
											style="border: 1px solid #095988; font-weight: bolder;">
											<input type="hidden" class="form-control" name="mailOTP"
											id="mailOTP" value="A0A0A0" />
										</td>
									</tr>

									<tr>
										<td colspan="5"
											style="text-align: center; border: 1px solid #3c8dbc;">
											<button type="button"
												th:if="${courseAllocationList.size() > 1 or llClassId!=null}"
												class="btn-success w3-btn w3-btn-green w3-round-large"
												th:data-parameter1="${oldClassId}"
												th:data-parameter2="${courseCatalogModel.getGenericCourseType()}"
												th:data-csrfname="${_csrf?.parameterName}"
												th:data-csrfvalue="${_csrf?.token}"
												th:onclick="javascript: UpdateSlots(this.getAttribute('data-parameter1'), this.getAttribute('data-parameter2'),
													this)">Update</button>
											&nbsp;&nbsp;&nbsp;
											<button type="button"
												class="btn-warning w3-btn w3-btn-darkGrey w3-round-large"
												onclick="goModifyPage();">Go Back</button>
										</td>
									</tr>

								</table>
							</div>
							
							<div>
							
							</div>

							<br /> <br />
						</form>
						
						

					</div>
				</div>
			</div>
		</div>
		<!-- /.content-wrapper -->
	</div>
</body>
</html>
