		{

		function getResults2(pageSize, page, searchType, searchVal, totalPage)
		{							
			if (parseInt(page) <= 0)
			{
				page = 1;
			}
			else if (parseInt(page) >= parseInt(totalPage))
			{
				page = totalPage;
			}
			$("#pageNo").val(page);
									
			var halfPagesToShow = pageSize / 2;
			var startPage = 0, endPage = 0;

			if (parseInt(totalPage) <= parseInt(pageSize))
			{
				startPage = 1;
				endPage = totalPage;
			}
			else if ((parseInt(page) - parseInt(halfPagesToShow)) <= 0)
			{
				startPage = 1;
				endPage = pageSize;
			}
			else if ((parseInt(page) + parseInt(halfPagesToShow)) == parseInt(totalPage))
			{
				startPage = parseInt(page) - parseInt(halfPagesToShow);
				endPage = totalPage;
			}
			else if ((parseInt(page) + parseInt(halfPagesToShow)) > parseInt(totalPage))
			{
				startPage = (parseInt(totalPage) - parseInt(pageSize)) + 1;
				endPage = totalPage;
			}
			else
			{
				startPage = parseInt(page) - parseInt(halfPagesToShow);
				endPage = parseInt(page) + parseInt(halfPagesToShow);
			}
			
		for (var i = 1; i <= totalPage; i++)
		{
			let div   = document.getElementById("pageDivId" + i);
			let li1   = document.getElementById("pgNoLiId1_" + i);
			let li2   = document.getElementById("pgNoLiId2_" + i);

			// handle pageDiv
			if (div) {
				div.style.display = (parseInt(i) === parseInt(page)) ? "block" : "none";
			}

			// handle li1
			if (li1) {
				li1.className    = (parseInt(i) === parseInt(page)) ? "active pointer-disabled" : "disabled";
				li1.style.display = (parseInt(i) >= parseInt(startPage) && parseInt(i) <= parseInt(endPage))
									? "block"
									: "none";
			}

			// handle li2
			if (li2) {
				li2.className    = (parseInt(i) === parseInt(page)) ? "active pointer-disabled" : "disabled";
				li2.style.display = (parseInt(i) >= parseInt(startPage) && parseInt(i) <= parseInt(endPage))
									? "block"
									: "none";
    }
}

		}

			$('html,body').animate({

		function padlength(what)
		{
			var output = (what.toString().length==1)? "0"+what : what;
			return output;
		}

		function displaytime()
		{
			serverdate.setSeconds(serverdate.getSeconds()+1);
			var datestring = padlength(serverdate.getDate()) +"-"+ montharray[serverdate.getMonth()] +"-"+ serverdate.getFullYear();
			var timestring = padlength(serverdate.getHours())+":"+padlength(serverdate.getMinutes())+":"+padlength(serverdate.getSeconds());
